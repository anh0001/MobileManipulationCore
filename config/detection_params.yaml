# Remote detection client/server parameters for visual-servo mode.

detection:
  # Jetson-side client topics
  # D405 wrist camera publishes color/image_raw (no rectified color stream).
  image_topic: "/piper/wrist_camera/piper_d405/color/image_raw"
  detection_topic: "/manipulation/target_detections"
  prompt_topic: "/visual_servo/target_prompt"

  # Remote detector endpoint (Grounding DINO server)
  # Local Grounding DINO server on this Jetson (docker, port 30543).
  remote_url: "http://localhost:30543"

  # Client request controls
  # Local grounding-dino-tiny on Orin (30W) runs ~1.5-1.8s/frame, so the timeout
  # must exceed that; rate stays 1Hz with in-flight skipping.
  request_rate_hz: 1.0
  request_timeout_sec: 8.0
  retry_attempts: 0
  max_result_staleness_sec: 5.0

  # Image payload optimization
  jpeg_quality: 70
  max_image_long_side_px: 640

  # Prompt and filtering
  # Objects here are TOY fruits — Grounding DINO matches them with a "toy <name>"
  # prompt; bare food words (e.g. "watermelon") miss the toy versions.
  default_prompt: "toy watermelon"
  box_threshold: 0.35
  text_threshold: 0.25
  min_score: 0.35
  max_detections: 5

  # CLIP re-rank / disambiguation (server-side). When enabled, Grounding DINO is
  # prompted with the whole scene_vocabulary (proposes every object) and CLIP
  # selects the box that actually matches the requested object. If the best match
  # is below clip_min_score, or within clip_margin of the runner-up, the result is
  # AMBIGUOUS and no detection is published -> the robot declines instead of
  # grasping the wrong item. List every object expected on the table here.
  clip_rerank: false
  # Disambiguation selector: "color" (dominant masked colour — robust when objects
  # are colour-distinct) or "clip" (vision-language). DINO+SAM run regardless.
  selector: "color"
  # DINO detection labels (also become the published class_id for per-object offset).
  # List exactly the objects on the table.
  scene_vocabulary:
    - "toy bread"
    - "yellow banana"
    - "red apple"
  # Expected dominant colour per object, ALIGNED 1:1 with scene_vocabulary. Used by
  # the "color" selector. Names: brown/red/yellow/green/orange/white/black/purple/
  # pink/blue.
  scene_colors:
    - "tan"
    - "yellow"
    - "red"
  color_max_dist: 95.0     # max RGB distance from the target colour to accept
  color_margin: 25.0       # target box must beat the nearest other-colour box by this
  # CLIP scoring text, ALIGNED 1:1 with scene_vocabulary. Decoupled from the DINO
  # label so CLIP gets a discriminative description. Leave empty to fall back to
  # "a photo of a <label>".
  clip_descriptions:
    - "a brown loaf of bread"
    - "a yellow banana"
    - "a red apple"
  clip_margin: 0.10
  clip_min_score: 0.30
  # Odd-one-out fallback: when CLIP cannot positively name the target (e.g. the
  # plush bread), it picks the box that matches the OTHER known objects least.
  # That box is accepted only if its best non-target match is below this.
  clip_elimination_max_other: 0.55

  # Logging/metrics
  metrics_log_interval_sec: 5.0
