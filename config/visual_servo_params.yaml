# Visual servoing parameters used by manipulation_bringup/core_launch.py.

visual_servo:
  detection_topic: "/manipulation/target_detections"
  rgb_topic: "/piper/wrist_camera/piper_d405/color/image_rect_raw"
  camera_info_topic: "/piper/wrist_camera/piper_d405/color/camera_info"
  depth_topic: "/piper/wrist_camera/piper_d405/depth/image_rect_raw"
  output_topic: "/manipulation/policy_output"

  use_depth: true
  control_rate_hz: 20.0
  output_delta_horizon_sec: 1.2   # Must match adapter servo_command_horizon_sec so velocity is preserved end-to-end

  # Keep empty when runtime prompt-based remote detection is used.
  target_class: ""
  min_detection_confidence: 0.4
  min_tracking_confidence: 0.5

  tracker_type: "mil"                  # Current build supports OpenCV MIL tracker
  klt_max_features: 200
  klt_quality_level: 0.01
  klt_min_distance: 5.0
  klt_window_size: 10
  klt_pyramid_levels: 3

  lost_target_timeout_sec: 2.0       # Must exceed detection period (~1 Hz) to avoid spurious LOST transitions
  acquire_timeout_sec: 5.0
  skill_acquire_timeout_sec: 20.0    # skill_server: max wait for visual servo to lock the target. Detection is ~0.3 Hz effective, so allow several detection cycles to accumulate before aborting (was 12s default)
  image_center_tolerance_px: 8.0       # Pixel error threshold to treat the target as centered
  camera_optical_frame: "piper_camera_optical_frame"  # Core launch may override from robot_params.yaml
  ee_frame: "piper_tcp"                # Tool center point mounted after piper_link6
  arm_base_frame: "piper_base_link"    # Core launch may override from robot_params.yaml
  reference_frame: "piper_base_link"
  grasp_standoff_m: 0.095              # D405 min reliable depth is ~0.088m; trigger grasp while depth is still readable
  grasp_depth_tolerance_m: 0.015       # Grasp band: 0.080–0.110m
  depth_sample_anchor_x: 0.50          # Normalized ROI x anchor (width fraction, right-positive)
  depth_sample_anchor_y: 0.50          # Normalized ROI y anchor (height fraction, down-positive); centered to avoid edge/background mixing at close range
  depth_roi_half_size_px: 6            # Half-width of the square depth sampling window around the anchor pixel
  min_valid_depth_pixels: 4            # Minimum non-zero depth pixels required in the sampling window (relaxed for close-range D405 gaps)
  depth_sample_max_iqr_m: 0.030        # Reject a depth sample if the local interquartile range exceeds this threshold (mild relax for translucent-bottle noise)
  depth_stale_timeout_sec: 1.0         # Allow for depth gaps (D405 at ~8 Hz + single-threaded executor delays)
  centering_stable_cycles: 3           # Number of consecutive centered control cycles before grasp sequence starts
  close_depth_stable_frames: 1         # Consecutive in-band depth samples before closing. Must be 1: during blind approach the no-depth path (line ~1514) resets close_depth_streak every cycle, so it can never accumulate >1 in blind mode. With translucent objects (blind path is the norm) >1 makes the close never fire. Proper fix is preserving the streak during blind approach in visual_servo_node.cpp.
  grasp_settle_sec: 1.5                # Wait time after open/close gripper commands before next state
  lift_distance_m: 0.08                # Upward lift distance after grasp completion
  max_approach_distance_m: 1.00        # Safety cap on total forward approach distance during one pick attempt
  approach_stall_window_sec: 1.5       # Abort if depth fails to improve enough over this rolling window while approaching
  approach_min_progress_m: 0.005       # Minimum depth improvement required over the stall window
  blind_approach_depth_threshold_m: 0.43  # Switch to blind approach when last good depth was below this (D405 depth on translucent bottle dies ~0.40m; threshold = last_good + 0.02)
  blind_approach_velocity_fraction: 0.30  # Fraction of max_linear_velocity for blind forward motion (~0.03 m/s)
  blind_approach_max_distance_m: 0.37     # Safety cap on total blind approach distance. last_good~0.429: need 0.334 to reach standoff + 0.02 after-push + margin
  blind_approach_after_standoff_m: 0.02  # Extra blind-push distance along end-effector +Z after depth reaches standoff (0 = disabled, close immediately)
  blind_push_timeout_sec: 12.0           # Exact timeout in seconds for the blind push along end-effector +Z
  blind_push_close_tolerance_m: 0.005    # If timeout occurs with <= this much blind-push distance remaining, close instead of restarting alignment
  blind_push_offset_x: 0.015             # Lateral offset (m) in reference frame applied during blind push (positive = arm +Y direction)
  blind_push_offset_y: 0.0              # Vertical offset (m) in reference frame applied during blind push (positive = arm +Z direction)
  open_gripper_settle_sec: 3.0         # Wait after issuing the direct GripperCommand open action
  gripper_open_position_tolerance: 0.008  # Require near-full open before approaching (else OPEN->APPROACH cancels the open goal mid-travel and the gripper descends partly closed)
  return_to_ready_after_pick: true     # Ask the adapter to send the arm back to its configured ready pose after DONEtry 

  # Per-object grasp offset overrides (base frame, meters). The detected object
  # class (Grounding DINO prompt label) selects a row by substring match, so the
  # key "banana" also matches the prompt "yellow banana". Objects not listed fall
  # back to `default` below. To add an object, append one entry to ALL FOUR lists
  # (same length and order).
  grasp_offsets:
    # Fallback offset for objects NOT in the list below (set to banana per request).
    default: { x: -0.0289, y: -0.018, z: -0.012 }
    objects: ["bread", "banana"]
    x: [-0.0289, -0.0289]
    y: [-0.018, -0.018]
    z: [-0.012, -0.012]

  control:
    lambda_xy: 2.0                     # Higher gain to overcome arm dead-band at small errors
    lambda_z: 2.0                     # Must overcome arm dead-band at small depth errors
    lambda_rz: 0.1
    max_linear_velocity: 0.10          # Match adapter servo_max_linear_velocity
    max_angular_velocity: 0.30
    ramp_up_steps: 5

  debug:
    publish_overlay: true
    overlay_topic: "/visual_servo/debug_image"
    publish_state: true
    state_topic: "/visual_servo/state"
