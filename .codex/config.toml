#:schema https://developers.openai.com/codex/config-schema.json

# Project-local Codex setup for MobileManipulationCore.
# Keep this lean and ROS-focused; do not mirror the full ECC global bundle.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
plan_mode_reasoning_effort = "high"

[features]
multi_agent = true
shell_snapshot = true

[agents]
max_threads = 4
max_depth = 1

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30
enabled = true

[mcp_servers.ros2]
command = "bash"
args = ["-lc", "source /opt/ros/humble/setup.bash && if [ -f /home/robofi/codes/MobileManipulationCore/install/setup.bash ]; then source /home/robofi/codes/MobileManipulationCore/install/setup.bash; fi && exec /home/robofi/.local/bin/rde-mcp-ros2"]
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true
