# Visual servoing parameters for manipulation_visual_servo
# This config is independent of robot_params.yaml and policy_params.yaml.
# Hardware topics/frames are passed in via launch arguments from robot_params.yaml.

visual_servo:
  # Topic configuration (overridden by launch arguments from robot_params.yaml)
  detection_topic: "/manipulation/target_detections"
  rgb_topic: "/piper/wrist_camera/piper_d405/color/image_rect_raw"
  camera_info_topic: "/piper/wrist_camera/piper_d405/color/camera_info"
  depth_topic: "/piper/wrist_camera/piper_d405/depth/image_rect_raw"
  output_topic: "/manipulation/policy_output"

  # Depth-guided pick parameters for the D405 wrist camera
  use_depth: true

  # Rate control
  control_rate_hz: 20.0

  # Target acquisition
  target_class: ""                    # Empty = use first/highest-confidence detection
  min_detection_confidence: 0.4
  min_tracking_confidence: 0.5

  # Tracker parameters
  tracker_type: "klt"                 # klt or blob
  klt_max_features: 200
  klt_quality_level: 0.01
  klt_min_distance: 5.0
  klt_window_size: 10
  klt_pyramid_levels: 3

  # State machine timeouts
  lost_target_timeout_sec: 2.0       # Must exceed detection period (~1 Hz) to avoid spurious LOST transitions
  acquire_timeout_sec: 5.0

  # Image-space convergence
  image_center_tolerance_px: 8.0       # Pixel error threshold to treat the target as centered
  grasp_standoff_m: 0.14               # Desired bottle distance from wrist camera (D405 ~7cm ahead of gripper fingers)
  grasp_depth_tolerance_m: 0.02        # Tolerance band for depth convergence
  depth_roi_half_size_px: 8            # Half-width of the square depth sampling window around ROI center
  min_valid_depth_pixels: 12           # Minimum non-zero depth pixels required in the sampling window
  depth_stale_timeout_sec: 1.0         # Allow for depth gaps (D405 at ~8 Hz + single-threaded executor delays)
  centering_stable_cycles: 3           # Number of consecutive centered control cycles before grasp sequence starts
  grasp_settle_sec: 1.5                # Wait time after open/close gripper commands before next state
  lift_distance_m: 0.08                # Upward lift distance after grasp completion
  max_approach_distance_m: 0.50        # Safety cap on total forward approach distance during one pick attempt
  open_gripper_command: 1.0            # Normalized gripper command sent before approach (1.0 = open)
  close_gripper_command: 0.0           # Normalized gripper command sent at grasp depth (0.0 = closed)

  # Reference frame for output PolicyOutput
  reference_frame: "piper_base_link"

  # IBVS control law gains
  control:
    lambda_xy: 2.0                    # Higher gain to overcome arm dead-band at small errors
    lambda_z: 2.0                     # Gain for depth/scale (forward/backward) — must overcome arm dead-band
    lambda_rz: 0.1                    # Gain for rotation about optical axis
    max_linear_velocity: 0.10         # Match adapter servo_max_linear_velocity
    max_angular_velocity: 0.30        # rad/s per axis, clamp on output twist
    ramp_up_steps: 5                  # Gradual ramp-up from zero to full gain

  # Debug output
  debug:
    publish_overlay: true
    overlay_topic: "/visual_servo/debug_image"
    publish_state: true
    state_topic: "/visual_servo/state"
