# Hybrid bottle pick parameters for manipulation_visual_servo
# This config replaces the old image-centering/depth-band visual servo pipeline
# with a hybrid pipeline: 3D estimation → MoveGroup pre-grasp → MoveIt Servo final → grasp.

visual_servo:
  # Topic configuration (overridden by launch arguments from robot_params.yaml)
  detection_topic: "/manipulation/target_detections"
  rgb_topic: "/piper/wrist_camera/piper_d405/color/image_rect_raw"
  camera_info_topic: "/piper/wrist_camera/piper_d405/color/camera_info"
  depth_topic: "/piper/wrist_camera/piper_d405/depth/image_rect_raw"
  output_topic: "/manipulation/policy_output"

  # Rate control
  control_rate_hz: 20.0

  # Target acquisition
  target_class: ""                    # Empty = use first/highest-confidence detection
  min_detection_confidence: 0.4

  # State machine timeouts
  lost_target_timeout_sec: 2.0
  acquire_timeout_sec: 5.0
  estimate_timeout_sec: 5.0
  pregrasp_timeout_sec: 15.0
  final_servo_timeout_sec: 10.0
  verify_timeout_sec: 2.0
  lift_timeout_sec: 10.0

  # TF frames
  reference_frame: "piper_base_link"
  camera_optical_frame: "piper_camera_optical_frame"
  ee_frame: "piper_tcp"
  arm_base_frame: "piper_base_link"

  # Depth sampling for 3D estimation
  depth_roi_body_top_frac: 0.30       # Crop top fraction of detection box (skip cap/neck)
  depth_roi_body_bottom_frac: 0.90    # Crop bottom fraction of detection box (skip base)
  depth_roi_body_left_frac: 0.20      # Crop left fraction of detection box width
  depth_roi_body_right_frac: 0.80     # Crop right fraction of detection box width
  min_valid_depth_pixels: 10
  depth_sample_max_iqr_m: 0.03
  depth_stale_timeout_sec: 1.0

  # Hybrid pick parameters
  eef_link_to_grasp_offset_m: 0.0      # Start with no extra EEF-to-grasp offset while validating TCP alignment
  pregrasp_offset_m: 0.08             # Additional retreat distance along the approach axis for pre-grasp pose
  grasp_approach_axis_x: 0.0          # Approach axis in arm_base_frame; default is top-down over a table
  grasp_approach_axis_y: 0.0
  grasp_approach_axis_z: -1.0
  final_servo_distance_m: 0.04        # Switch to Servo for the last N meters of approach
  grasp_settle_sec: 1.0               # Wait time after gripper open/close before next state
  lift_distance_m: 0.08               # Upward lift distance after grasp
  retreat_distance_m: 0.05            # Backward retreat after lift

  # Object grasp orientation for piper_tcp using Euler angles in degrees.
  # Reference: absolute piper_tcp orientation expressed in arm_base_frame /
  # piper_base_link, not relative to the object.
  # Convention: standard ROS fixed-axis roll, pitch, yaw about base-frame +X, +Y, +Z.
  # With piper_tcp local +Z as tool-forward, roll=180 points the TCP down.
  object_grasp_roll_deg: 0.0
  object_grasp_pitch_deg: 120.0
  object_grasp_yaw_deg: 0.0

  # Convergence thresholds
  final_position_tolerance_m: 0.008   # Cartesian residual threshold for close command
  final_image_tolerance_px: 12.0      # Image-space error threshold for close command
  final_convergence_cycles: 3         # Consecutive cycles both thresholds must hold

  # Grasp verification
  open_gripper_command: 1.0
  close_gripper_command: 0.0
  grasp_success_min_width: 0.003      # Minimum gripper width above closed_position to confirm grasp
  gripper_closed_position: 0.0        # Fully closed gripper joint position (for verification)

  # Final servo control gains
  servo_control:
    lambda_xy: 2.0                    # Image-space proportional gain
    lambda_z: 2.0                     # Depth proportional gain
    max_linear_velocity: 0.05         # Reduced velocity for final servo phase
    max_angular_velocity: 0.20
    ramp_up_steps: 3

  # Debug output
  debug:
    publish_overlay: true
    overlay_topic: "/visual_servo/debug_image"
    publish_state: true
    state_topic: "/visual_servo/state"
